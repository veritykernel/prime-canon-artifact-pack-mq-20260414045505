name: publish-guard-trusted

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  publish-guard-trusted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.number }}/head
          path: candidate
          persist-credentials: false
      - name: Check exact PR head with protected-base code
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git -C trusted rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          export PYTHONDONTWRITEBYTECODE=1
          python3 trusted/scripts/check_publish_guard_trusted.py trusted candidate
